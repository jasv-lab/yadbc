name: App release

# Tag v1.2.3 → a GitHub release v1.2.3 with the Windows installer (dev/package-windows.ps1) and the Linux
# AppImage (dev/package-linux.sh), each with its Velopack update feed (releases.win.json / .linux.json).
# With SignPath set up (repository variable SIGNPATH_ORGANIZATION_ID, secret SIGNPATH_API_TOKEN), the
# installer is signed first; the run waits for an approver to approve the request in SignPath.
# Without them, the release goes out unsigned.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read # SignPath downloads the unsigned installer from this run's artifacts

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Version
        shell: pwsh
        run: "'VERSION=' + $env:GITHUB_REF_NAME.TrimStart('v') >> $env:GITHUB_ENV"
      - name: Build the installer
        shell: pwsh
        run: ./dev/package-windows.ps1 -Version $env:VERSION

      - name: Upload the unsigned installer for signing
        id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: dist/release/yadbc-win-Setup.exe
      - name: Sign the installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: yadbc
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # time for an approver to approve
          output-artifact-directory: dist/signed
      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item dist/signed/yadbc-win-Setup.exe dist/release/yadbc-win-Setup.exe -Force
          $sig = Get-AuthenticodeSignature dist/release/yadbc-win-Setup.exe
          if ($sig.Status -ne 'Valid') { throw "Installer signature: $($sig.Status)" }
          "Signed by: $($sig.SignerCertificate.Subject)"

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/release/*

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the AppImage
        run: ./dev/package-linux.sh "${GITHUB_REF_NAME#v}"
      # Headless (no web view needed): the AppImage starts, serves its UI and knows it's installed (updates on).
      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          YADBC_HEADLESS: '1'
          YADBC_PORT: '5179'
          YADBC_DATA_DIR: ${{ runner.temp }}/yadbc
        run: |
          dist/release/yadbc.AppImage > "$RUNNER_TEMP/yadbc.log" 2>&1 &
          for i in $(seq 1 60); do grep -q 'token=' "$RUNNER_TEMP/yadbc.log" && break; sleep 1; done
          token=$(grep -o 'token=[0-9a-f]*' "$RUNNER_TEMP/yadbc.log" | cut -d= -f2)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5179/)" = 200
          curl -sf -H "X-Yadbc-Token: $token" http://127.0.0.1:5179/api/update | grep -q '"enabled":true'
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/release/*

  release:
    name: GitHub release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "yadbc ${GITHUB_REF_NAME#v}" --generate-notes
