name: Broker image

# Builds the shared-connections broker image (src/Yadbc.Broker/Dockerfile) and pushes it to
# ghcr.io/<owner>/yadbc-broker:
#   main            → :main and :sha-<short sha>
#   tag broker-v1.2.3 → :1.2.3
# Pull requests build it without pushing.

on:
  push:
    branches: [main]
    tags: ['broker-v*']
    paths:
      - src/Yadbc.Broker/**
      - src/Yadbc.Contracts/**
      - .github/workflows/broker-image.yml
  pull_request:
    paths:
      - src/Yadbc.Broker/**
      - src/Yadbc.Contracts/**
      - .github/workflows/broker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        # GHCR wants lowercase; the owner may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yadbc-broker" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=main,enable={{is_default_branch}}
            type=match,pattern=broker-v(.*),group=1

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Yadbc.Broker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
