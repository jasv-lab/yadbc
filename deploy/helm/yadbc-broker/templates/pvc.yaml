apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "yadbc-broker.name" . }}-data
  labels: {{- include "yadbc-broker.labels" . | nindent 4 }}
  annotations:
    # The database outlives an uninstall; delete the claim yourself if you mean it.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
