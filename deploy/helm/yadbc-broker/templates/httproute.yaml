{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "yadbc-broker.name" . }}
  labels: {{- include "yadbc-broker.labels" . | nindent 4 }}
spec:
  parentRefs: {{- required "httpRoute.parentRefs is required" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  hostnames: {{- required "httpRoute.hostnames is required" .Values.httpRoute.hostnames | toYaml | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "yadbc-broker.name" . }}
          port: 80
{{- end }}
