{{- if not .Values.existingSecret }}
{{- $name := printf "%s-secrets" (include "yadbc-broker.name" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# Created only when no existingSecret is named. The login key is generated once and then read back
# from the cluster on every upgrade (lookup), and the Secret stays on uninstall: a new key would make
# every stored login unreadable.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "yadbc-broker.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "Broker__LoginKey") }}
  Broker__LoginKey: {{ index $existing.data "Broker__LoginKey" }}
  {{- else }}
  Broker__LoginKey: {{ randBytes 32 | b64enc }}
  {{- end }}
  Broker__Oidc__ClientSecret: {{ required "oidc.clientSecret is required when the chart creates the Secret (or name an existingSecret)" .Values.oidc.clientSecret | b64enc }}
{{- end }}
