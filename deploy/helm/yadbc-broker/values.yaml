# yadbc shared-connections broker. See docs/design.md §10b and deploy/README.md.

image:
  # The published chart points at the image published with it (ghcr.io/<owner>/yadbc-broker);
  # from a checkout, set it to wherever you pushed src/Yadbc.Broker/Dockerfile's image.
  repository: ""
  tag: "" # default: the chart's appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

oidc:
  # Issuer URL: https://login.microsoftonline.com/<tenant-id>/v2.0, a Keycloak realm, any OIDC provider.
  authority: "" # required
  clientId: "" # required
  # Only used when the chart creates the Secret (existingSecret empty).
  clientSecret: ""
  scopes: [profile, email]
  # Providers that keep names and emails out of the ID token need the userinfo call.
  useUserInfo: false
  # The stable user id: the first of these claims present (Entra's oid; sub elsewhere).
  idClaims: [oid, sub]
  # Who is admin (may edit and delete any share): an Entra app role by default.
  adminClaim: roles
  adminValue: yadbc.admin

# The broker's two secrets:
#   Broker__LoginKey            encrypts the stored logins — lose it and owners re-enter them
#   Broker__Oidc__ClientSecret  the OIDC client secret
# Either name a Secret you created (preferred for GitOps: `helm template` can't keep a generated key),
# or leave this empty and the chart creates one: the login key is generated on first install and
# kept on upgrades and on uninstall; the client secret comes from oidc.clientSecret.
existingSecret: ""

deviceTokenDays: 90
backupKeepDays: 7

persistence:
  # One small volume for broker.db and its nightly backups. Any RWO class works, NFS included:
  # SQLite runs with one connection in exclusive locking mode (no shared-memory WAL index).
  storageClass: "" # cluster default
  size: 1Gi

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# Expose it either through a Gateway API HTTPRoute…
httpRoute:
  enabled: false
  # One hostname on one Gateway listener (this is what the Rancher form sets)…
  hostname: "" # yadbc.example.com
  gateway:
    name: ""
    namespace: ""
    sectionName: "" # the listener; set it, or the route attaches to every listener of the Gateway
  # …or the full lists, which win when set:
  # parentRefs: [{ name: my-gateway, namespace: gateway-system, sectionName: https }]
  # hostnames: [yadbc.example.com]
  parentRefs: []
  hostnames: []

# …or a classic Ingress. TLS terminates in front of the broker; it trusts X-Forwarded-Proto.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: "" # yadbc.example.com
  tlsSecretName: ""
